[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "entity-matcher"
version = "0.1.0a0"
description = "Local product-catalog comparison with human-reviewed evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/entity_matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
